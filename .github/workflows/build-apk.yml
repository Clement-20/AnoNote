name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Android platform scaffolding
        working-directory: ./flutter_wrapper
        run: |
          flutter create . --platforms=android --org=com.anonote
          flutter pub get

      - name: Build Release APK
        working-directory: ./flutter_wrapper
        run: flutter build apk --release --no-tree-shake-icons

      - name: Copy and Rename APK
        run: |
          mkdir -p build_output
          cp flutter_wrapper/build/app/outputs/flutter-apk/app-release.apk build_output/anonote.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anonote-apk
          path: build_output/anonote.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: build_output/anonote.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Release v1.0.0' }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
